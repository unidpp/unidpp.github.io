<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6572"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#FAFAF7"/>
  <text x="48" y="34" font-size="11" letter-spacing="2.5" fill="#14335C" font-weight="600">UNIDPP-ISSUER · RUST SERVICE</text>
  <text x="48" y="58" font-size="20" font-weight="600" fill="#1A2332">The life of a passport, as four endpoints</text>
  <text x="48" y="76" font-size="12" fill="#5A6572">axum service · server keyring via unidpp-signatif (real Ed25519/P256) · registry-backed profile bindings</text>

  <!-- bike on the left -->
  <rect x="48" y="100" width="180" height="380" rx="10" fill="#FFFFFF" stroke="#E3E7EC"/>
  <text x="64" y="126" font-size="12.5" font-weight="600" fill="#14335C">The subject</text>
  <circle cx="110" cy="190" r="34" fill="none" stroke="#1A2332" stroke-width="3"/>
  <circle cx="196" cy="190" r="18" fill="none" stroke="#1A2332" stroke-width="3"/>
  <path d="M 110 190 L 150 158 L 178 158 M 150 158 L 158 176 M 110 190 L 140 216 L 176 216 M 140 216 L 130 236" fill="none" stroke="#1A2332" stroke-width="3"/>
  <rect x="94" y="140" width="44" height="16" rx="4" fill="none" stroke="#1A2332" stroke-width="2.5"/>
  <text x="64" y="262" font-size="11" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" fill="#14335C">momiji:e8/J-000842</text>
  <text x="64" y="284" font-size="10.5" fill="#5A6572">each lifecycle moment on</text>
  <text x="64" y="300" font-size="10.5" fill="#5A6572">the right is one HTTP call;</text>
  <text x="64" y="316" font-size="10.5" fill="#5A6572">the event log grows only</text>
  <text x="64" y="332" font-size="10.5" fill="#5A6572">by appends, each signed</text>
  <text x="64" y="352" font-size="10.5" fill="#5A6572">with the server keyring —</text>
  <text x="64" y="368" font-size="10.5" fill="#5A6572">TrustMarker::Attested</text>
  <text x="64" y="400" font-size="10.5" fill="#5A6572">issuance roles are open:</text>
  <text x="64" y="416" font-size="10.5" fill="#5A6572">manufacturer, importer,</text>
  <text x="64" y="432" font-size="10.5" fill="#5A6572">registrar, transformer,</text>
  <text x="64" y="448" font-size="10.5" fill="#5A6572">qualified attestor (V1)</text>

  <!-- endpoints -->
  <g>
    <rect x="296" y="100" width="616" height="84" rx="8" fill="#FFFFFF" stroke="#14335C" stroke-width="1.5"/>
    <text x="312" y="126" font-size="12" font-weight="600" fill="#14335C" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace">POST /passports</text>
    <text x="312" y="146" font-size="10.5" fill="#5A6572">body: identity · type ref + version · config vector · capability class → returns passport ID + empty log</text>
    <text x="312" y="164" font-size="10.5" fill="#5A6572">B1: type+instance in Kyoto · V1: commissioning with nullable type</text>
    <circle cx="888" cy="114" r="12" fill="#14335C"/><text x="888" y="118" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">1</text>

    <rect x="296" y="200" width="616" height="84" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
    <text x="312" y="226" font-size="12" font-weight="600" fill="#14335C" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace">POST /passports/{id}/events</text>
    <text x="312" y="246" font-size="10.5" fill="#5A6572">append typed event (E1–E15) · server signs → TrustMarker::Attested · profile re-evaluation hooks</text>
    <text x="312" y="264" font-size="10.5" fill="#5A6572">B3 binding · B5 edge dump · B6 derestriction · B7 swap · B8 custody/stamp · B9 recall evaluation</text>
    <circle cx="888" cy="214" r="12" fill="#14335C"/><text x="888" y="218" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">6</text>

    <rect x="296" y="300" width="616" height="84" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
    <text x="312" y="326" font-size="12" font-weight="600" fill="#14335C" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace">POST /passports/{id}/pack</text>
    <text x="312" y="346" font-size="10.5" fill="#5A6572">mint the Tier-A pack — REAL multi-suite signatures via unidpp-signatif (Ed25519 · P256 · PQ)</text>
    <text x="312" y="364" font-size="10.5" fill="#5A6572">B4: this is the bytes that go on the frame sticker and into the offline verifier</text>
    <circle cx="888" cy="314" r="12" fill="#14335C"/><text x="888" y="318" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">4</text>

    <rect x="296" y="400" width="616" height="84" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
    <text x="312" y="426" font-size="12" font-weight="600" fill="#14335C" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace">GET /passports/{id} · GET /passports/{id}/verdict</text>
    <text x="312" y="446" font-size="10.5" fill="#5A6572">render core + manifest + log head · full pipeline verdict with coverage report</text>
    <text x="312" y="464" font-size="10.5" fill="#5A6572">what the explorer and the CLI consume · what the auction house rendered for B8</text>
    <circle cx="888" cy="414" r="12" fill="#14335C"/><text x="888" y="418" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">8</text>
  </g>
  <line x1="228" y1="142" x2="294" y2="142" stroke="#5A6572" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="228" y1="242" x2="294" y2="242" stroke="#5A6572" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="228" y1="342" x2="294" y2="342" stroke="#5A6572" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="228" y1="442" x2="294" y2="442" stroke="#5A6572" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="48" y="510" font-size="10.5" fill="#5A6572">Key management: seeded dev keyring, env-key prod mode · admin: register profiles and applicability bindings from the registry · reference patterns from oimlsmart/identity.</text>
</svg>
