  <line x1="420" y1="192" x2="220" y2="258" stroke="#5A6572" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="192" x2="480" y2="258" stroke="#5A6572" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="192" x2="740" y2="258" stroke="#5A6572" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="392" y="228" font-size="10.5" fill="#5A6572">R3 install {method, slotId, pairing, alteration[], recoverability}</text>

  <!-- dormant leaves -->
