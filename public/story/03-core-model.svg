  <text x="64" y="486" font-size="11" font-weight="600" fill="#14335C">IDENTITY LATTICE</text>
  <g font-size="10.5" fill="#1A2332">
    <text x="200" y="486">manufacturer</text><text x="290" y="486" fill="#5A6572">→</text>
    <text x="312" y="486">model</text><text x="370" y="486" fill="#5A6572">→</text>
    <text x="392" y="486">type-version</text><text x="492" y="486" fill="#5A6572">→</text>
    <text x="514" y="486">configuration</text><text x="626" y="486" fill="#5A6572">→</text>
    <text x="648" y="486">instance</text>
    <text x="200" y="503" fill="#5A6572">actor, not a level</text>
    <text x="312" y="503" fill="#5A6572">registry nav only</text>
    <text x="392" y="503" fill="#5A6572">hardware revs visible</text>
    <text x="514" y="503" fill="#5A6572">options compose like children</text>
    <text x="648" y="503" fill="#5A6572">where passports issue</text>
