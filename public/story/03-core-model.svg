  <text x="76" y="174" font-size="10.5" fill="#5A6572">2028.1 rev visible</text>
  <line x1="240" y1="146" x2="298" y2="146" stroke="#5A6572" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="252" y="136" font-size="10" fill="#5A6572">R4</text>

  <!-- children -->
  <g>
    <rect x="60" y="260" width="250" height="108" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
