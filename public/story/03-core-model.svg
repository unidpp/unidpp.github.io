    <text x="668" y="284" font-size="12" font-weight="600" fill="#1A2332">Charger · CN</text>
    <text x="668" y="302" font-size="10.5" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" fill="#14335C">CQC-2026-1142…</text>
    <text x="668" y="320" font-size="10.5" fill="#5A6572">cert ↔ product ↔ facility join</text>
    <text x="668" y="336" font-size="10.5" fill="#5A6572">GB 4943.1 ≈ IEC 62368-1</text>
