    <circle cx="290" cy="274" r="12" fill="#14335C"/><text x="290" y="278" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">2</text>

    <rect x="356" y="260" width="250" height="108" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
