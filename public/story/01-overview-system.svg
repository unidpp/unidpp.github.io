<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'IBM Plex Sans',-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6572"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#FAFAF7"/>
  <text x="48" y="34" font-size="11" letter-spacing="2.5" fill="#14335C" font-weight="600">UNIDPP · THE SYSTEM IN ONE PICTURE</text>
  <text x="48" y="58" font-size="20" font-weight="600" fill="#1A2332">One e-bike, five planes, two rails</text>
  <text x="48" y="76" font-size="12" fill="#5A6572">Momiji E8 J-000842 — JP type, EU placement, CN cells, device edge state</text>

  <!-- main stack -->
  <rect x="48" y="92" width="540" height="56" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
  <text x="64" y="114" font-size="12.5" font-weight="600" fill="#14335C">CARRIER — QR / NFC · ISO/IEC 18004 · identity per ISO/IEC 15459</text>
  <text x="64" y="132" font-size="11" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" fill="#5A6572">P&lt;MOMIJI&lt;E8&lt;J-000842&lt;&lt;&lt;&lt;&lt;8402274&lt;&lt;&lt;</text>
  <circle cx="560" cy="106" r="12" fill="#14335C"/><text x="560" y="110" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">4</text>

  <line x1="318" y1="148" x2="318" y2="172" stroke="#5A6572" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="164" font-size="10.5" fill="#5A6572">S1 code ↔ URI</text>

  <rect x="48" y="174" width="540" height="56" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
  <text x="64" y="196" font-size="12.5" font-weight="600" fill="#14335C">RESOLVER — RFC 9264 linkset · routes by (profile, role, language, region)</text>
  <text x="64" y="214" font-size="11" fill="#5A6572">national mirrors · cached linksets · dark identities</text>
  <circle cx="560" cy="188" r="12" fill="#14335C"/><text x="560" y="192" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">4</text>

  <line x1="318" y1="230" x2="318" y2="254" stroke="#5A6572" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="246" font-size="10.5" fill="#5A6572">S2 hosts &amp; mirrors</text>

  <rect x="48" y="256" width="540" height="56" rx="8" fill="#FFFFFF" stroke="#14335C" stroke-width="1.5"/>
  <text x="64" y="278" font-size="12.5" font-weight="600" fill="#14335C">NEUTRAL CORE PASSPORT — minimal skeleton (L1)</text>
  <text x="64" y="296" font-size="11" fill="#5A6572">IDs · status · profile manifest · event-log head · multi-suite signatures</text>
  <text x="560" y="278" font-size="10.5" font-family="'IBM Plex Mono',ui-monospace,Menlo,monospace" fill="#14335C" text-anchor="end">momiji:e8/J-000842</text>
  <circle cx="560" cy="270" r="12" fill="#14335C"/><text x="560" y="274" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">1</text>

  <line x1="318" y1="312" x2="318" y2="336" stroke="#5A6572" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="328" font-size="10.5" fill="#8C6D1F" font-weight="600">S3 the mount — neutrality enforced here</text>

  <rect x="48" y="338" width="540" height="62" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
  <text x="64" y="358" font-size="12.5" font-weight="600" fill="#8C6D1F">LENSES — registered, versioned, signed profiles</text>
  <rect x="64" y="366" width="150" height="24" rx="12" fill="#FFFFFF" stroke="#8C6D1F"/><text x="139" y="382" font-size="11" fill="#8C6D1F" text-anchor="middle">JP road-traffic</text>
  <rect x="224" y="366" width="170" height="24" rx="12" fill="#FFFFFF" stroke="#8C6D1F"/><text x="309" y="382" font-size="11" fill="#8C6D1F" text-anchor="middle">EU machinery + battery</text>
  <rect x="404" y="366" width="120" height="24" rx="12" fill="#FFFFFF" stroke="#8C6D1F"/><text x="464" y="382" font-size="11" fill="#8C6D1F" text-anchor="middle">UN 3171 DG</text>
  <circle cx="560" cy="352" r="12" fill="#14335C"/><text x="560" y="356" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">3</text>

  <line x1="318" y1="400" x2="318" y2="424" stroke="#5A6572" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="416" font-size="10.5" fill="#5A6572">S8 projection</text>

  <rect x="48" y="426" width="540" height="56" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
  <text x="64" y="448" font-size="12.5" font-weight="600" fill="#1A2332">TWIN — union of event segments (the authoritative record)</text>
  <text x="64" y="466" font-size="11" fill="#5A6572">testimonial by default (EO, dealer, cert body) · device edge S2/S3 by exception</text>
  <circle cx="560" cy="440" r="12" fill="#14335C"/><text x="560" y="444" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">5</text>

  <!-- trust rail -->
  <rect x="616" y="92" width="150" height="390" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
  <text x="632" y="118" font-size="11" letter-spacing="1.5" fill="#14335C" font-weight="600">TRUST · SIGNATIF</text>
  <rect x="632" y="132" width="118" height="34" rx="6" fill="#F4F6F9"/><text x="691" y="146" font-size="11" fill="#1A2332" text-anchor="middle">JP threshold root</text><text x="691" y="160" font-size="10" fill="#5A6572" text-anchor="middle">no single key</text>
  <rect x="632" y="176" width="118" height="34" rx="6" fill="#F4F6F9"/><text x="691" y="190" font-size="11" fill="#1A2332" text-anchor="middle">EU eIDAS list</text><text x="691" y="204" font-size="10" fill="#5A6572" text-anchor="middle">scoped acceptance</text>
  <rect x="632" y="220" width="118" height="34" rx="6" fill="#F4F6F9"/><text x="691" y="234" font-size="11" fill="#1A2332" text-anchor="middle">Master list</text><text x="691" y="248" font-size="10" fill="#5A6572" text-anchor="middle">M-of-K quorum</text>
  <rect x="632" y="264" width="118" height="34" rx="6" fill="#F4F6F9"/><text x="691" y="278" font-size="11" fill="#1A2332" text-anchor="middle">Transparency log</text><text x="691" y="292" font-size="10" fill="#5A6572" text-anchor="middle">anchors commitments</text>
  <rect x="632" y="308" width="118" height="52" rx="6" fill="#F4F6F9"/><text x="691" y="324" font-size="11" fill="#1A2332" text-anchor="middle">Multi-suite sigs</text><text x="691" y="338" font-size="10" fill="#5A6572" text-anchor="middle">JP suite · EU ECDSA</text><text x="691" y="351" font-size="10" fill="#5A6572" text-anchor="middle">PQ ML-DSA co-sig</text>
  <rect x="632" y="370" width="118" height="40" rx="6" fill="#F4F6F9"/><text x="691" y="386" font-size="11" fill="#1A2332" text-anchor="middle">Revocation</text><text x="691" y="400" font-size="10" fill="#5A6572" text-anchor="middle">reason ⇒ retroactivity</text>
  <circle cx="740" cy="106" r="12" fill="#14335C"/><text x="740" y="110" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">4</text>
  <circle cx="740" cy="446" r="12" fill="#14335C"/><text x="740" y="450" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">6</text>

  <!-- registry rail -->
  <rect x="790" y="92" width="122" height="390" rx="8" fill="#FFFFFF" stroke="#E3E7EC"/>
  <text x="806" y="118" font-size="11" letter-spacing="1.5" fill="#1E6B4F" font-weight="600">REGISTRY · FERIN</text>
  <text x="806" y="140" font-size="11" fill="#1A2332">ISO 19135 items:</text>
  <text x="806" y="160" font-size="10.5" fill="#5A6572">· profiles (lenses)</text>
  <text x="806" y="177" font-size="10.5" fill="#5A6572">· data elements</text>
  <text x="806" y="194" font-size="10.5" fill="#5A6572">· crypto suites</text>
  <text x="806" y="211" font-size="10.5" fill="#5A6572">· trust anchors</text>
  <text x="806" y="228" font-size="10.5" fill="#5A6572">· equivalence maps</text>
  <text x="806" y="245" font-size="10.5" fill="#5A6572">· recall predicates</text>
  <text x="806" y="272" font-size="10.5" fill="#5A6572">applicability =</text>
  <text x="806" y="288" font-size="10.5" fill="#5A6572">dated bindings on</text>
  <text x="806" y="304" font-size="10.5" fill="#5A6572">one identity</text>
  <text x="806" y="332" font-size="10.5" fill="#5A6572">item lifecycle:</text>
  <text x="806" y="348" font-size="10.5" fill="#5A6572">proposal → valid</text>
  <text x="806" y="364" font-size="10.5" fill="#5A6572">→ superseded</text>
  <circle cx="890" cy="106" r="12" fill="#14335C"/><text x="890" y="110" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">3</text>
  <circle cx="890" cy="446" r="12" fill="#14335C"/><text x="890" y="450" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="600">9</text>

  <!-- tier ladder strip -->
  <rect x="48" y="496" width="864" height="34" rx="6" fill="#F4F6F9"/>
  <text x="64" y="517" font-size="11.5" fill="#1A2332" font-weight="600">DEGRADATION LADDER</text>
  <text x="220" y="517" font-size="11" fill="#1A2332">Tier A — offline minimum on carrier (B4)</text>
  <text x="470" y="517" font-size="11" fill="#1A2332">Tier B — served, per profile</text>
  <text x="650" y="517" font-size="11" fill="#1A2332">Tier C — archival, notarized as-of (B10)</text>

  <line x1="588" y1="284" x2="616" y2="284" stroke="#5A6572" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="588" y1="300" x2="790" y2="300" stroke="#5A6572" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
