data:
  definition:
  - content: deterministic, registered and legally cited view of the testimonial record
      of a governed digital twin, computed under a profile from the event-sourced
      change log
  notes:
  - content: The passport is the legal materialized view of the twin; the twin is
      the source of truth.
  - content: Notarized snapshots support as-of queries, which answer what was legally
      true at a given time.
  - content: Any conforming twin can emit the view; the projection is defined representation-neutrally.
  sources:
