data:
  definition:
  - content: 'system property by which the passport system is verifiable without being
      browsable: resolution is by identity only, traversal requires per-edge rights,
      and no party — including any registry, resolver network or log operator — can
      enumerate the installed base of anything'
  notes:
  - content: Transparency logs anchor commitments (hashes), never facts, so log operators
      cannot correlate edges; accumulator and blind-membership proofs give valid-standing
      checks without revealing which or where.
  - content: Stated as design invariant I12, together with blind edges by default
      where households or sites are revealed (concept dpp-0136), proof of binding
      distinct from knowledge of parent (concept dpp-0138), and predicate-based recall
      (concept dpp-0140).
  terms:
  - type: expression
    normative_status: preferred
    designation: enumeration resistance
  language_code: eng
  annotations: []
termid: dpp-0139
