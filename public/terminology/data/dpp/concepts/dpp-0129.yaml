data:
  definition:
  - content: typed event in the provenance directed acyclic graph that records the
      split of one passport into many, or the combination or transformation of many
      passports into one
  notes:
  - content: The output issuance event carries input references of passport, quantity
      and as-of state hash, so the new passport hash-links its sources.
  - content: Quantities resulting from a transformation are new measured facts with
      provenance “computed by transformation event”, never copies; mass balance is
      auditable as input minus output equals loss.
  - content: 'Inputs transition to consumed or transformed status: historical, still
      verifiable, still needed for as-of queries.'
  sources:
  - origin:
      ref:
        source: UniDPP PLAN (2026-09)
        id: Semantic exchange, stamps, and the transformation algebra
    type: lineage
  terms:
