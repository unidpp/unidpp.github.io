data:
  definition:
  - content: declared per-data-element attribute of a profile stating which truth
      source the element requires — attest-sampled, self-committed, or both with a
      precedence rule
  notes:
  - content: The passive twin (concept dpp-0132) supplies attest-sampled truth and
      the active twin (concept dpp-0133) supplies self-committed truth; both paradigms
      coexist permanently in the framework.
  - content: Precedence between a calibrated device measurement and an attestor observation
      is itself a metrological hierarchy question.
  - content: 'Freshness and verification requirements must be satisfiable by the subject''s
      capability class: demanding live freshness from an S0 (silent) product is an
      unsatisfiable profile.'
  terms:
  - type: expression
    normative_status: preferred
    designation: truth mode
  language_code: eng
  annotations: []
