data:
  definition:
  - content: salted cryptographic commitment to the parent, recorded in the child's
      event log, by which a child satisfies the bidirectional parent-knowledge requirement
      without disclosing the identity of the parent
  notes:
  - content: 'Proof of binding is distinct from knowledge of parent: verifiable modes
      establish that the child is validly installed in some parent under a given profile
      (warranty, compliance) without revealing which parent; full disclosure occurs
      only by ceremony.'
  - content: An optional escrow envelope under a threshold trustee (concept dpp-0137)
      accompanies the commitment where future disclosure must remain possible.
  terms:
  - type: expression
    normative_status: preferred
    designation: proof of binding
  language_code: eng
  annotations: []
