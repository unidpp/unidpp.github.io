data:
  definition:
  - content: digital twin in which the object self-reports under device keys, making
      truth near-continuous, freshness bounded and detectable, and shifting the binding
      question from who saw the object to who attests the sensor
  notes:
  - content: Corresponds to capability classes S2 (logged contact) and S3 (connected).
  - content: 'Measurement validity becomes load-bearing: sensor calibration, uncertainty
      of self-reported values and registered units; health status is a derived verdict.'
  - content: Profiles declare, per data element, the required truth mode — attest-sampled,
      self-committed, or both with precedence.
  terms:
  - type: expression
    normative_status: preferred
    designation: active twin
  language_code: eng
  annotations: []
