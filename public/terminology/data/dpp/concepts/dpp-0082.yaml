data:
  definition:
  - content: high-level statement about a characteristic of a product, or about a
      process or an organization associated with that product (traceable asset). A
      sustainability claim is a claim that covers one or multiple sustainability dimensions
      (economic, environmental, social)
  notes:
  - content: In this document “sustainability claims” are referred to as just “claims”.
