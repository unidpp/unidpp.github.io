data:
  definition:
  - content: declared component of a profile stating the conditions under which the
      profile applies, evaluated against the facts of the digital twin rather than
      against who declares them
  notes:
  - content: Characteristic profiles (concept dpp-0125) attach by predicate on twin
      facts — age, material content, heritage status, market status — rather than
      by law-of-place or industry.
  - content: 'Predicate triggers include time predicates: an object becoming older
      than a given age is a clock-fired applicability event, handled by the dated-binding
      machinery so that applicability attaches without human declaration.'
  - content: The expression "characteristic profile trigger" denotes this predicate
      as used by a characteristic profile and is folded into this concept rather than
      recorded separately.
  sources:
  - origin:
      ref:
        source: UniDPP PLAN (2026-09)
        id: The regional/national profile model (stream 11)
