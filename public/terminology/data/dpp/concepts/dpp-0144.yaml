data:
  definition:
  - content: component recovered from an installation (concept dpp-0142) in the harvestable
      state of the recoverability spectrum (concept dpp-0143), which continues to
      carry its own identity, harvested status and the parent history accumulated
      during installation
  notes:
  - content: 'Installation history is value-relevant provenance: a harvested battery
      sold standalone carries its service interval and removal reason, and the used-parts
      market runs on this.'
  - content: 'A harvested part is second-hand-once-removed: no longer sellable as
      new, with warranty scope and service economics that rode the parent during installation.'
  sources:
