data:
  definition:
  - content: additional application, program, or tool that a user will install or
      access separately from the default setup of most smartphones or similar devices
      to interact with the digital product passport
  examples:
  - content: Proprietary applications, plugins or extensions, dedicated apps, specialized
      middleware, or customized software readers.
  notes:
  - content: Standard functionalities, such as web browsers, camera-based QR readers,
      and universal communication protocols (e.g. DNS, HTTP, HTTPS), are not considered
      as additional software.
  sources:
  - origin:
      ref:
        source: EN 18220:2026
        id: '3.1'
    type: authoritative
  terms:
  - type: expression
    normative_status: preferred
    designation: additional software
  language_code: eng
  annotations: []
