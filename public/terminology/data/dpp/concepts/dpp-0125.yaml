data:
  definition:
  - content: profile that attaches by predicate on digital twin facts — such as age,
      material content, heritage status or market status — rather than by law-of-place
      or industry
  notes:
  - content: Characteristic profiles split into regulatory-triggered profiles (for
      example CITES species content, cultural-goods import controls, art-market due
      diligence, conflict-minerals origin) and voluntary value profiles (for example
      provenance and grading for antiques and collectibles).
  - content: 'Predicate triggers include time predicates: an object becoming older
      than a given age is a clock-fired applicability event handled by the dated-binding
      machinery.'
  terms:
  - type: expression
    normative_status: preferred
    designation: characteristic profile
  language_code: eng
  annotations: []
