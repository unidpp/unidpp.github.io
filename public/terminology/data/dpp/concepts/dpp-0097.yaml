data:
  definition:
  - content: entity owned by or under the custodial duties of an organization, which
      has either a perceived or actual value to the organization
  examples:
  - content: Examples for physical entities are equipment, raw material, parts components
      and pieces, supplies, consumables, physical products, and waste.
  - content: Software is an example of a digital asset.
  - content: A software license is an example of an intangible asset.
  notes:
  - content: An asset can be single entity, a collection of entities, an assembly
      of entities or a composition of entities.
