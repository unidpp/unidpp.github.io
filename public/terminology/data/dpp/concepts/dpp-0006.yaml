data:
  definition:
  - content: identifier which is guaranteed to be unique among all identifiers used
      for those objects and for a specific purpose
  notes:
  - content: A unique identifier refers to unique product identifier (3.1.25), unique
      economic operator identifier (3.1.22), and unique facility identifier (3.1.23).
  - content: For more information, see ISO/IEC 15459-1.
