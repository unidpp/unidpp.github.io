data:
  definition:
  - content: string of characters that is required to be unique among all identifiers
      used for all objects for a specific purpose
  notes:
  - content: A unique identifier refers to unique product identifier (3.1.25), unique
      economic operator identifier (3.1.22), and unique facility identifier (3.1.23).
  - content: CWA 18291:2025 defines “Unique Identifier” as an identifier which is
      guaranteed to be unique; see concept dpp-0007.
