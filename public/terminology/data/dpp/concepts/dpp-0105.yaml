data:
  definition:
  - content: information and services representing an entity from a given viewpoint
  examples:
  - content: Examples of information are properties (e.g. maximum temperature), actual
      parameters (e.g. actual velocity), events (e.g. notification of status change),
      schematics (electrical), and visualization information (2D and 3D drawings).
  - content: Examples of services are asset services (for example providing the history
      of the configuration data or providing the actual velocity) and asset related
      services (for example providing a simulation).
  - content: Examples of viewpoints are mechanical, electrical, or commercial characteristics.
  sources:
