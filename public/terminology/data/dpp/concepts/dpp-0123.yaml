data:
  definition:
  - content: chain of custody model in which materials or products with a set of specified
      characteristics are mixed according to defined criteria with materials or products
      without that set of characteristics
  notes:
  - content: The proportion of the input with specified characteristics can only match
      the initial proportions on average and will typically vary across different
      outputs.
