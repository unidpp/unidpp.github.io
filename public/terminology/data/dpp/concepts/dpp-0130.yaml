data:
  definition:
  - content: passport issued as the output of a transformation event by an actor accredited
      for the regulated claims it contains, hash-linking its input passports
  notes:
  - content: Only accredited actors may issue derived passports for regulated claims
      (the notified-actor pattern of EN 18239).
  - content: Children of a split carry a derived-from reference and quantity carve-outs,
      with the sum of children not exceeding the parent (remainder semantics).
  terms:
  - type: expression
    normative_status: preferred
    designation: derived passport
  language_code: eng
  annotations: []
