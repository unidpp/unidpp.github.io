data:
  definition:
  - content: property that data has not been altered or destroyed in an unauthorised
      manner
  notes:
  - content: In the context of secure communication, data integrity ensures that data
      transmitted between parties remains unaltered and intact from the moment it
      leaves the sender to the moment it reaches the receiver. This means that the
      data has not been tampered with, modified, or corrupted during transmission
      – whether accidentally or through malicious actions.
