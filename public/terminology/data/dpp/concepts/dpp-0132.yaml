data:
  definition:
  - content: digital twin reconstructed from point-in-time attestations about the
      object, sampled when the object visits an attestor, in which truth is episodic
      and staleness between attestations is unbounded and undetectable
  notes:
  - content: Corresponds to capability classes S0 (silent, testimony-only) and S1
      (passive authentication).
  - content: Trust rides entirely on attestor authority; the twin is testimonial by
      default and sensorial by exception.
  terms:
  - type: expression
    normative_status: preferred
    designation: passive twin
  language_code: eng
  annotations: []
