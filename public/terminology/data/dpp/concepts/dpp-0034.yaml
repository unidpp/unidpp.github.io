data:
  definition:
  - content: natural or legal person that is an independent third party authorized
      by the economic operator (3.1) that places the product on the market or puts
      it into service and that processes the digital product passport data for that
      product for the purpose of making such data available to economic operators
      and other relevant actors with a right to access those data
  sources:
