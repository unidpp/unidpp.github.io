data:
  definition:
  - content: lens-scoped attestation consisting of an attester signature over the
      subject, the subject state commitment, the lens identity and version, the mode
      (live or snapshot), a verdict with coverage report, and log-anchored time
  notes:
  - content: Stamps accrete append-only and are valid under the stamper's lens regardless
      of the issuer's.
  - content: Jurisdiction stamps on a foreign-issued passport correspond to visas;
      entry and exit stamps correspond to verifier custody events.
  - content: Stamps may carry quantity context, inherited by downstream transformations.
  terms:
  - type: expression
    normative_status: preferred
    designation: stamp
  language_code: eng
  annotations: []
