data:
  definition:
  - content: signed ceremony recording the transfer of responsibility for an object
      between custodians, appended to the event chain by the custodian and the counterparty,
      which extends and never overwrites the trail across successive owners
  notes:
  - content: 'Custody links are social and control edges, orthogonal to structural
      composition: ownership changes while composition stays fixed.'
