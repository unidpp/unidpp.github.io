data:
  definition:
  - content: "(abstract) representation of a set of instance assets with common characteristics
      and features"
  examples:
  - content: Examples of type assets are type of material, a product type, a type
      of a part, a device type, a machine type, a type of software, a type of control
      system, a type of production system.
  notes:
  - content: The set of instance assets may exist or may not exist.
