data:
  definition:
  - content: digital record of product characteristics throughout its life cycle that
      is accessible via electronic means through a data carrier
  notes:
  - content: Example characteristics include environmental sustainability, environmental
      impact, and recyclability.
  - content: 'Harmonization note (UniDPP): EN 18219:2026 and EN 18220:2026 extend
      the definition by accessibility through a data carrier; the shorter formulation
      shared by EN 18216:2026, EN 18221:2026, EN 18222:2026, EN 18223:2026, EN 18239
      and EN 18246 is recorded under concept dpp-0001, where the definitional conflict
      with ISO/AWI 25534-1 is also annotated.'
