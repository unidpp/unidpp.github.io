data:
  definition:
  - content: a concept or technology which enables sharing of product related information
      that is essential for product sustainability and circularity, including those
      specified in regulations, across all relevant economic actors
  notes:
  - content: Example characteristics include environmental sustainability, environmental
      impact, and recyclability.
  - content: 'Definitional conflict: the EN 182xx series (18216, 18221, 18222, 18223,
      18239, 18246) define DPP as a "digital record of product characteristics throughout
      its life cycle" — differing in noun (concept/technology vs record) and in stated
      scope (across relevant economic actors vs throughout the life cycle).'
  - content: 'Definitional variant: EN 18219:2026 (§3.1.3) and EN 18220:2026 (§3.6)
      extend the EN-family definition with "accessible via electronic means through
      a data carrier" — a functional statement of the carrier subset of the ISO concept.'
  sources:
