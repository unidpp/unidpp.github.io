data:
  definition:
  - content: carrier-embedded minimum viable passport, comprising the product identifier,
      the resolver URI, the economic operator identifier, the status, the critical
      safety or recall flag, the validity and multi-suite compressed signatures, sized
      to the data carrier and verifiable offline against pre-cached trust anchors
  notes:
  - content: The three-tier degradation ladder comprises Tier A (carrier-embedded
      minimum), Tier B (served full passport) and Tier C (archival).
  - content: Stale or offline data degrades explicitly through freshness verdicts
      and never passes silently.
  terms:
  - type: expression
    normative_status: preferred
    designation: Tier-A payload
  language_code: eng
  annotations: []
