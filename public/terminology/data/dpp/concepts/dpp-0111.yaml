data:
  definition:
  - content: defined characteristic suitable for the description and differentiation
      of products or components
  notes:
  - content: The concept of type and instance applies to properties.
  - content: This definition applies to properties as described in IEC 61360/ ISO
      13584-42.
  - content: The property types are defined in dictionaries (like IEC component data
      dictionary or ECLASS), they do not have a value. The property type is also called
      data element type in some standards.
  - content: The property instances have a value and are provided by the manufacturers.
      A property instance is also called property-value pair in certain standards.
  - content: Properties include nominal value, actual value, runtime variables, measurement
      values, etc.
  - content: A property describes one characteristic of a given object.
  - content: The specification of a property can include predefined choices of values.
