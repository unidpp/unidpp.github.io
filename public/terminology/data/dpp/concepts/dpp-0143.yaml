data:
  definition:
  - content: declared property of an installation binding (concept dpp-0142) stating
      whether and how the installed child can resume an independent existence, taking
      one of the values restorable, harvestable, destructive or absorbing
  notes:
  - content: 'Restorable: the child resumes standalone life; harvestable: recovered
      but altered, continuing with harvested status and parent history (concept dpp-0144);
      destructive: the child ceases and flows to a material passport through a transformation
      event (concept dpp-0129); absorbing: identity dissolves into the parent.'
  - content: 'Absorption is regime-temporal rather than permanent: absorbed inputs
      are recorded at the finest available granularity as dormant identifiers (concept
      dpp-0135), issuable by adoption when a future regime requires passports for
      the object class.'
  - content: Carried in the EXPRESS core as part of the PassportLink binding {method,
      recoverability}.
  terms:
  - type: expression
    normative_status: preferred
    designation: recoverability
  language_code: eng
  annotations: []
