data:
  definition:
  - content: company or company function that performs activities to obtain recovered
      resources for use in a process or a product, excluding energy recovery
  notes:
  - content: Activities to obtain resources include activities such as recovery, collection,
      transport, sorting, cleaning, and re-processing.
  - content: Recycling does not include reuse.
  sources:
  - origin:
