data:
  definition:
  - content: edge visibility arrangement in which information concealed by a blind
      edge (concept dpp-0136) is deposited with a threshold trustee and released only
      through a disclosure ceremony — court, regulator or consent
  notes:
  - content: The installation schema records escrow as none or trustee, with declared
      audiences.
  - content: An escrow envelope under a threshold trustee may optionally accompany
      a proof of binding (concept dpp-0138), preserving verifiability while full disclosure
      remains ceremonial.
