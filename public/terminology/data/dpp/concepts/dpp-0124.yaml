data:
  definition:
  - content: registered, versioned object that binds a set of data points, transforms,
      cryptographic suites, trust requirements, access policies, presentation requirements
      and a trigger predicate to the neutral core passport, constraining and transforming
      — but never redefining — the single definition of each data point
  notes:
  - content: 'Composition is three-axial: jurisdiction × sector × characteristic.'
  - content: Each profile is a projection function, view(twinState, profile, actor),
      whose projection may transform and not merely select.
  - content: Profiles constrain and transform; inter-profile disagreement is expected
      and auditable, while intra-class contradiction is an integrity incident (single
      definition, many constraints).
  terms:
  - type: expression
    normative_status: preferred
    designation: profile
  language_code: eng
  annotations: []
